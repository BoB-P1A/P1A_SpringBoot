services:
  backend:
    build: .
    container_name: epia-springboot-backend
    restart: unless-stopped

    # .env에서 공통 환경변수 불러옴
    env_file:
      - .env

    environment:
      # MongoDB (Atlas) 연결 URI – .env의 MONGO_URI를 Spring이 읽도록 매핑
      SPRING_DATA_MONGODB_URI: ${MONGO_URI}

      # JWT 시크릿 (코드에서 @Value("${JWT_SECRET}") 등으로 사용 중이라면)
      JWT_SECRET: ${JWT_SECRET}

      # AWS S3 (이미 application.yml에서 ${AWS_...} 참조하고 있음)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      AWS_REGION: ${AWS_REGION}

    ports:
      - "8081:8081"