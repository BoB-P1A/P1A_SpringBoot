server:
  port: 8081

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins:
      - http://localhost:8080
      - http://localhost:3000
  files:
    local-base-dir: /tmp/epia-files

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:epia}
    region: ${AWS_REGION:ap-southeast-2}
    access-key-id: ${AWS_ACCESS_KEY_ID}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY}
